<!-- ═══════════════════════════════════════════════════════
     MAGIC SPRAY — ORDER SECTION (image left, form right)
     Drop this block anywhere inside your <body>.
     Replace the .ms-image div with your <img> later.
     ═══════════════════════════════════════════════════════ -->

<style>
.ms-section, .ms-section * { box-sizing: border-box; }

.ms-section {
  font-family: 'Barlow', system-ui, -apple-system, sans-serif;
  max-width: 1080px;
  margin: 60px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
  color: #e4f5e4;
}

/* ── LEFT: Image placeholder (replace with your <img>) ── */
.ms-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #0d130d;
  border: 1px dashed #1e301e;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: #2d4a2d;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── RIGHT: Form ── */
.ms-form { margin: 0; padding: 0; }
.ms-form * { margin: 0; padding: 0; box-sizing: border-box; }

.ms-form-inner {
  padding: 28px 24px;
  background: #111a11;
  border: 1px solid #1e301e;
  border-radius: 14px;
}

.ms-form .ms-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 6px;
}
.ms-form .ms-title span { color: #3ddc68; }

.ms-form .ms-sub {
  text-align: center;
  font-size: 13px;
  color: #6b9b6b;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
}

.ms-form .ms-field { margin-bottom: 14px; }

.ms-form label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #6b9b6b;
  margin-bottom: 6px;
}

.ms-form input,
.ms-form select {
  width: 100%;
  padding: 12px 14px;
  background: #0d130d;
  border: 1px solid #1e301e;
  border-radius: 10px;
  color: #e4f5e4;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.ms-form input:focus,
.ms-form select:focus {
  border-color: #3ddc68;
  box-shadow: 0 0 0 3px rgba(61,220,104,0.15);
}

.ms-form input::placeholder { color: #2d4a2d; }

.ms-form .ms-qty { display: flex; gap: 8px; }
.ms-form .ms-qty button {
  flex: 1;
  padding: 12px;
  background: #0d130d;
  border: 1px solid #1e301e;
  border-radius: 10px;
  color: #e4f5e4;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.ms-form .ms-qty button:hover { border-color: #2a422a; }
.ms-form .ms-qty button.active {
  background: rgba(61,220,104,0.1);
  border-color: #3ddc68;
  color: #3ddc68;
}

.ms-form .ms-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  background: #0d130d;
  border: 1px solid #1e301e;
  border-radius: 10px;
  margin: 18px 0 16px;
}
.ms-form .ms-total-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #6b9b6b;
}
.ms-form .ms-total-amount {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px;
  font-weight: 800;
  color: #3ddc68;
  letter-spacing: 1px;
}

.ms-form .ms-submit {
  width: 100%;
  padding: 16px;
  background: #3ddc68;
  border: none;
  border-radius: 10px;
  color: #060a06;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.ms-form .ms-submit:hover { background: #28c254; transform: translateY(-1px); }
.ms-form .ms-submit:active { transform: translateY(0); }

.ms-form .ms-success { display: none; text-align: center; padding: 20px 0; }
.ms-form .ms-success.show { display: block; }
.ms-form .ms-success .ms-check {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: rgba(61,220,104,0.12);
  border: 2px solid #3ddc68;
  display: grid; place-items: center;
  margin: 0 auto 14px;
  color: #3ddc68; font-size: 28px;
}
.ms-form .ms-success h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 6px;
}
.ms-form .ms-success p { color: #6b9b6b; font-size: 14px; }

/* ── MOBILE: stack vertically (image on top, form below) ── */
@media (max-width: 760px) {
  .ms-section {
    grid-template-columns: 1fr;
    gap: 24px;
    margin: 30px auto;
  }
  .ms-image {
    aspect-ratio: 4 / 3;
    max-height: 320px;
  }
}
</style>

<section class="ms-section">

  <!-- ▼ LEFT: image goes here. Replace this whole div with: -->
  <!-- <img src="your-image.jpg" alt="Magic Spray" class="ms-image" style="object-fit: cover;"> -->
  <div class="ms-image">
    Image · 1:1
  </div>
  <!-- ▲ END image slot -->

  <!-- RIGHT: order form -->
  <form class="ms-form" id="msForm" onsubmit="return msSubmit(event)">
    <div class="ms-form-inner">
      <div class="ms-title">Magic <span>Spray</span></div>
      <div class="ms-sub">Commander · Livraison partout en Algérie</div>

      <div id="msFields">
        <div class="ms-field">
          <label for="ms-name">Nom complet</label>
          <input type="text" id="ms-name" required placeholder="Votre nom et prénom">
        </div>

        <div class="ms-field">
          <label for="ms-phone">Téléphone</label>
          <input type="tel" id="ms-phone" required placeholder="0X XX XX XX XX" pattern="[0-9 ]{10,}">
        </div>

        <div class="ms-field">
          <label for="ms-wilaya">Wilaya</label>
          <select id="ms-wilaya" required>
            <option value="">— Choisir votre wilaya —</option>
            <option>01 - Adrar</option><option>02 - Chlef</option><option>03 - Laghouat</option>
            <option>04 - Oum El Bouaghi</option><option>05 - Batna</option><option>06 - Béjaïa</option>
            <option>07 - Biskra</option><option>08 - Béchar</option><option>09 - Blida</option>
            <option>10 - Bouira</option><option>11 - Tamanrasset</option><option>12 - Tébessa</option>
            <option>13 - Tlemcen</option><option>14 - Tiaret</option><option>15 - Tizi Ouzou</option>
            <option>16 - Alger</option><option>17 - Djelfa</option><option>18 - Jijel</option>
            <option>19 - Sétif</option><option>20 - Saïda</option><option>21 - Skikda</option>
            <option>22 - Sidi Bel Abbès</option><option>23 - Annaba</option><option>24 - Guelma</option>
            <option>25 - Constantine</option><option>26 - Médéa</option><option>27 - Mostaganem</option>
            <option>28 - M'Sila</option><option>29 - Mascara</option><option>30 - Ouargla</option>
            <option>31 - Oran</option><option>32 - El Bayadh</option><option>33 - Illizi</option>
            <option>34 - Bordj Bou Arréridj</option><option>35 - Boumerdès</option><option>36 - El Tarf</option>
            <option>37 - Tindouf</option><option>38 - Tissemsilt</option><option>39 - El Oued</option>
            <option>40 - Khenchela</option><option>41 - Souk Ahras</option><option>42 - Tipaza</option>
            <option>43 - Mila</option><option>44 - Aïn Defla</option><option>45 - Naâma</option>
            <option>46 - Aïn Témouchent</option><option>47 - Ghardaïa</option><option>48 - Relizane</option>
            <option>49 - Timimoun</option><option>50 - Bordj Badji Mokhtar</option><option>51 - Ouled Djellal</option>
            <option>52 - Béni Abbès</option><option>53 - In Salah</option><option>54 - In Guezzam</option>
            <option>55 - Touggourt</option><option>56 - Djanet</option><option>57 - El M'Ghair</option>
            <option>58 - El Meniaa</option>
          </select>
        </div>

        <div class="ms-field">
          <label for="ms-address">Adresse</label>
          <input type="text" id="ms-address" required placeholder="Commune, rue, point de repère">
        </div>

        <div class="ms-field">
          <label>Quantité</label>
          <div class="ms-qty">
            <button type="button" data-q="1" class="active">1 × 500ml</button>
            <button type="button" data-q="2">2 × 500ml</button>
            <button type="button" data-q="3">3 × 500ml</button>
          </div>
        </div>

        <div class="ms-total">
          <span class="ms-total-label">Total</span>
          <span class="ms-total-amount" id="ms-total">2800 DA</span>
        </div>

        <button type="submit" class="ms-submit">Confirmer la commande</button>
      </div>

      <div class="ms-success" id="msSuccess">
        <div class="ms-check">✓</div>
        <h3>Commande reçue</h3>
        <p>Nous vous contacterons dans les plus brefs délais.</p>
      </div>
    </div>
  </form>

</section>

<script>
(function() {
  var PRICE = 2800;
  var qty = 1;
  var btns = document.querySelectorAll('.ms-form .ms-qty button');
  var totalEl = document.getElementById('ms-total');

  btns.forEach(function(b) {
    b.addEventListener('click', function() {
      btns.forEach(function(x) { x.classList.remove('active'); });
      this.classList.add('active');
      qty = parseInt(this.dataset.q);
      totalEl.textContent = (PRICE * qty) + ' DA';
    });
  });

  window.msSubmit = function(e) {
    e.preventDefault();
    // ▼ HOOK YOUR BACKEND / GOOGLE SHEET / WHATSAPP HERE ▼
    var order = {
      name:    document.getElementById('ms-name').value,
      phone:   document.getElementById('ms-phone').value,
      wilaya:  document.getElementById('ms-wilaya').value,
      address: document.getElementById('ms-address').value,
      qty:     qty,
      total:   PRICE * qty
    };
    console.log('Order:', order);
    // ▲ END HOOK ▲

    document.getElementById('msFields').style.display = 'none';
    document.getElementById('msSuccess').classList.add('show');
    return false;
  };
})();
</script>
